<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            width: 80%;
            border: 1px solid black;
        }
        div{
            border: 1px solid black;
            width: 150px;
        }
    </style>
</head>
<body>
    <div>I am a Div Element.</div>
</body>
</html>

<!-- 
Pixels are a unit of measurement in CSS that represent a single point on the screen. 
They are commonly used for defining the size of elements, such as fonts, images, and layout dimensions. 
Pixels are a fixed unit, meaning they do not scale with the user's screen resolution or zoom level.

Syntax:
    property: value; /* where value is specified in pixels, e.g., 16px */
-->
