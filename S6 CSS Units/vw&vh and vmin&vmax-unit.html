<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .Parent{
            width: 50vw;
            height: 50vh;
            border: 1vw solid black;
        } /* The width of the parent element is set to 50vw, 
            which means it will be 50% of the viewport width that is the width of the browser window
            and 
            the height will be 50vh, which means it will be 50% of the viewport height that is the height of the browser window
            and 
            the border will be 1vw wide because 1vw is equal to 1% of the viewport width */
        .Child{
            width: 25vmin;
            height: 25vmax;
            border: 2vmin solid black;
        } /* The width of the child element is set to 25vmin, 
            which means it will be 25% of the smaller dimension of the viewport (either width or height) 
            that is the width or height of the browser window
            and 
            the height will be 25vmax, which means it will be 25% of the larger dimension of the viewport (either width or height)
            that is the width or height of the browser window
            and 
            the border will be 2vmin wide because 2vmin is equal to 2% of the smaller dimension of the viewport */
    </style>
</head>
<body>
    <div class="Parent">
        From Parent
        <div class="Child">From Child</div>
</body>
</html>

<!-- 
vw and vh units are relative units of measurement in CSS that are based on the viewport size.
1vw is equal to 1% of the width of the viewport.
1vh is equal to 1% of the height of the viewport.
For example, if the viewport width is 1000px, then 1vw is equal to 10px.
For example, if the viewport height is 1000px, then 1vh is equal to 10px.

Syntax:
    property: valuevw; /* where value is specified in vw units, e.g., 2vw */
    property: valuevh; /* where value is specified in vh units, e.g., 2vh */

They are useful for creating responsive designs that adapt to different screen sizes and orientations.
-->
<!-- 
vmin and vmax units are relative units of measurement in CSS that are based on the viewport size.
1vmin is equal to 1% of the smaller dimension of the viewport (either width or height).
1vmax is equal to 1% of the larger dimension of the viewport (either width or height).
For example, if the viewport width is 1000px and the height is 500px, then 1vmin is equal to 5px and 1vmax is equal to 10px.

Syntax:
    property: valuevmin; /* where value is specified in vmin units, e.g., 2vmin */
    property: valuevmax; /* where value is specified in vmax units, e.g., 2vmax */

They are useful for creating responsive designs that adapt to different screen sizes and orientations, 
especially when you want to maintain a consistent aspect ratio or size relative to the viewport.
-->
