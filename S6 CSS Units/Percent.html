<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            width: 80%;
            border: 1px solid black;
        } /* The width of the body is set to 80% of the viewport width */
        div{
            border: 1px solid black;
            width: 50%;
        } /* The width of the div is set to 50% of its parent element (the body in this case) */
    </style>
</head>
<body>
    <div>
        This is a div element with a width of 50%.
    </div>
</body>
</html>

<!-- 
Percentages are a unit of measurement in CSS that represent a proportion of a parent element's size.
They are commonly used for defining the size of elements, such as widths, heights, and margins

Syntax:
    property: value%; /* where value is specified in percentage, e.g., 50% */
-->
