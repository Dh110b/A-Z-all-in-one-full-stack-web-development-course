<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            border: 2px solid red; /* sets a red border around the P element */
            padding: 22px; /* sets a padding of 22px on all sides of the P element */
        }
        div{
            border: 2px solid blue; /* sets a blue border around the DIV element */
            padding-top: 22px; /* sets a padding of 22px on the top side of the DIV element */
            padding-right: 50px; /* sets a padding of 50px on the right side of the DIV element */
            padding-bottom: 22px; /* sets a padding of 22px on the bottom side of the DIV element */
            padding-left: 50px; /* sets a padding of 50px on the left side of the DIV element */
        }
    </style>
</head>
<body>
    <p>This is a P element.</p>
    <div>This is a DIV element.</div>
</body>
</html>

<!-- 
Padding is the space between the content of an element and its border.
Padding can be set for all four sides of an element (top, right, bottom, left) or individually.
Padding values can be set in different units such as pixels (px), em, rem, percentages (%), etc.

Syntax:
padding: value; /* sets padding for all sides */
padding-top: value; /* sets padding for the top side */
padding-right: value; /* sets padding for the right side */
padding-bottom: value; /* sets padding for the bottom side */
padding-left: value; /* sets padding for the left side */

They are used to create space inside an element, between the content and the border.
Click on Inspect Element to see the padding values in the browser's developer tools.
This will help you understand how padding affects the layout of elements on the page.

Always set padding for the largest element first, then set padding for the smaller elements.
This will help you maintain a consistent layout and spacing between elements.
The distance between 2 elements is determined by the sum of their padding.
-->
