<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0; /* removes default margin from the body */
        }
        p{
            border: 2px solid red; /* sets a red border around the P element */
            margin: 22px; /* sets a margin of 22px on all sides of the P element */
            text-align: center; /* centers the content of the P element horizontally */
        }
        div{
            border: 2px solid blue; /* sets a blue border around the DIV element */
            margin-top: 22px; /* sets a margin of 22px on the top side of the DIV element */
            margin-right: 12px; /* sets a margin of 22px on the right side of the DIV element */
            margin-bottom: 22px; /* sets a margin of 22px on the bottom side of the DIV element */
            margin-left: 12px; /* sets a margin of 22px on the left side of the DIV element */
        }
    </style>
</head>
<body>
    <p>This is a P element.</p>
    <div>This is a DIV element.</div>
</body>
</html>

<!-- 
Margins are the spaces outside the border of an element. 
They create space between elements and can be set using CSS properties. 
Margins can be set for all four sides of an element (top, right, bottom, left) or individually.
The margin values can be set in different units such as pixels (px), em, rem, percentages (%), etc.

Syntax:
margin: value; /* sets margin for all sides */
margin-top: value; /* sets margin for the top side */
margin-right: value; /* sets margin for the right side */
margin-bottom: value; /* sets margin for the bottom side */
margin-left: value; /* sets margin for the left side */

Click on Inspect Element to see the margin values in the browser's developer tools.
This will help you understand how margins affect the layout of elements on the page.

Always set margin for the largest element first, then set margin for the smaller elements. 
This will help you maintain a consistent layout and spacing between elements.

The distance between 2 elements is determined by the sum of their margins. 
If both elements have a margin, the larger margin will be used to create space between them. 
This is known as margin collapsing.
-->
