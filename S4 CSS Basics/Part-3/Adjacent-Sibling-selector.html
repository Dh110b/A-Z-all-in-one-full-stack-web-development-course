<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div + p {
            color: red;
        }
    </style>
</head>
<body>
    <div>
        <p>This is a paragraph.</p>
        <section>
            <p>This is a paragraph inside a section.</p>
        </section>
    </div>

    <p>This is a paragraph inside another section outside div.</p>

    <div>
        <p>This is a paragraph inside another div.</p>
    </div>
</body>
</html>

<!-- 
In this File, we are using the adjacent sibling selector to select the paragraph that is immediately following a div element. 
The CSS rule `div + p` targets any `<p>` element that comes directly after a `<div>` element, and applies the color red to it.

Syntax:
div + p {
    color: red;
}

We used the adjacent sibling selector to style the paragraph that is immediately following a div element. 
The first paragraph inside the div is not affected by this rule, 
but the paragraph that comes after the div is styled with red color.

This is a simple example of how to use the adjacent sibling selector in CSS to style elements 
based on their relationship in the HTML structure.

This occurs in the HTML structure where the paragraph is a sibling of the div, and it is immediately following it.
-->
