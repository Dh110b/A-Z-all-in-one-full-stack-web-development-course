<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            border-style: dotted;
            border-width: 2px;
            border-color: Red;
            padding: 10px;
            margin: 10px;
        }
        div{
            border: 1px solid black;
            padding: 10px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div>This is a div with a dotted border.</div>
</body>
</html>

<!-- 
The border property in CSS is used to define the style, width, and color of an element's border.
It allows you to create visual boundaries around elements, enhancing the overall design and layout of a webpage.

Syntax:
selector {
    border: [border-width] [border-style] [border-color];
}
    or
selector {
    border-style: [value];
    border-width: [value];
    border-color: [value];
}

This property can be applied to various HTML elements, such as divs, paragraphs, images, and more. 
It is commonly used to create visual separation between elements or to highlight specific content on a webpage.

Example:
div {
    border: 2px solid red;
    padding: 10px;
    margin: 10px;
}

or

div {
    border-style: dotted;
    border-width: 2px;
    border-color: red;
    padding: 10px;
    margin: 10px;
}
-->
