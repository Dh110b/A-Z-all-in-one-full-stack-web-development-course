<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .centre-text {
            text-align: center;
        }
        .red{
            color: red;
        }
    </style>
</head>
<body>
    <p class="red">This is a paragraph.</p>
    <div class="centre-text red">This is a div.</div>
    <!-- 
    In this example, we have a paragraph and a div with different class attributes.
    The paragraph with class "red" will be red, while the div with classes "centre-text" and "red" will be centered and red.
    Here we are using multiple class selectors to style the div element with both the "centre-text" and "red" classes.
    This means that the div element will have both the styles defined for the "centre-text" class and 
    the "red" class applied to it.

    With ID selectors, we can only apply one ID to an element, so we cannot use multiple ID selectors on the same element.
    -->
</body>
</html>
