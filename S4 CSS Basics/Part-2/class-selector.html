<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .info {
            color: red;
            font-size: 20px;
        }
        div.info {
            color: green;
            font-size: 32px;
        }
    </style>
</head>
<body>
    <!-- 
    Class selectors are used to select elements with a specific class attribute.
    In this example, we have a paragraph and a div with different class names,
    and we are using the class selector to style them differently.
    The paragraph with class "info" will be green, 
    while the div with class "info" will have a red background and blue text.

    Note that class selectors are denoted by the "." symbol followed by the class value.
    Class selectors can be used on multiple elements, meaning that the same class value can be used
    on multiple elements in an HTML document.
    class selector for same class name can be used for multiple elements in an HTML document.
    For example, in this example, we have two paragraphs and a div with the same class name "info",
    and we are using the class selector to style them all with the same styles.
    -->
    <p class="info">This is a paragraph with the info class.</p>

    <p class="info">This is another paragraph with the info class.</p>

    <div class="info">This is a div with the info class.</div>

</body>
</html>
