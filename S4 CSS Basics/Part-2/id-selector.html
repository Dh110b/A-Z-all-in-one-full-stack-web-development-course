<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #address1 {
            color: green;
            font-size: 20px;
        }
        /* This is ID selector for address1  */
        #address2 {
            color: blue;
            font-size: 20px;
        }
        /* This is ID selector for address2  */
    </style>
</head>
<body>
    <!-- 
    ID selector is used to select a single element with a specific id attribute. 
    In this example, we have two paragraphs with different ids, and we are using the id selector to style them differently.
    The first paragraph with id "address1" will be green, while the second paragraph with id "address2" will be blue.
    Note that ID selectors are denoted by the "#" symbol followed by the id value.
    ID selectors are unique, meaning that each id value should only be used once in an HTML document. 
    -->

    <p id="address1">This is a paragraph is in green.</p>
    <p id="address2">This is another paragraph in blue.</p>
</body>
</html>
